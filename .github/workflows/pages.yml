name: pages

# Статическую версию тренажёра собираем из тех же .py файлов, что лежат
# в algorythms/part-1 — отдельной копии контента в репозитории нет.
on:
  push:
    branches: [main]
    paths:
      - "algorythms/part-1/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: эталоны должны проходить свои тесты
        run: |
          for f in algorythms/part-1/ethalons/block*/*.py; do
            echo "== $f"
            python3 "$f"
          done

      - name: собрать статику
        run: python3 web/build_static.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
