<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шаблоны алгоритмов — тренажёр</title>
<style>
:root {                                   /* светлая — по умолчанию */
  --bg: #f4f6f9;
  --panel: #ffffff;
  --panel-2: #eef1f6;
  --line: #d5dae3;
  --text: #14181f;                        /* 16:1 к panel */
  --muted: #454d5e;                       /* 8.7:1  */
  --dim: #5f687a;                         /* 6:1    */
  --accent: #1f47c4;
  --ok: #0f6b3f;
  --bad: #b0202f;
  --warn: #8a5300;
  --kw: #6d21b0;
  --str: #15663d;
  --com: #56607a;                         /* комментарии в коде, 5.6:1 */
  --num: #9a4200;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* лист с документом */
  --doc-bg: #ffffff;
  --doc-text: #14181d;
  --doc-soft: #5a6470;
  --doc-line: #e2e6ea;
  --doc-code-bg: #f5f7f9;
  --doc-kw: #7226b5;
  --doc-str: #15663d;
  --doc-com: #5a6470;
  --doc-num: #9a4200;

  /* сравнение с эталоном */
  --diff-chg: #fff4d6;
  --diff-del: #fde8eb;
  --diff-ins: #e6f0ff;
  --diff-mark: #ffd27a;
  --diff-gap: #f3f5f8;
}

/* тёмная: системная (если тему не выбрали руками) и выбранная явно */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101319;
    --panel: #181c25;
    --panel-2: #1f2532;
    --line: #2f3747;
    --text: #eaeef6;                      /* 14:1 к panel */
    --muted: #b3bdd0;                     /* 8.6:1 */
    --dim: #8d97ab;                       /* 5.5:1 */
    --accent: #93b4ff;
    --ok: #86e39a;
    --bad: #ff93a6;
    --warn: #f2c47c;
    --kw: #cbaaff;
    --str: #a9e58c;
    --com: #96a1b8;                       /* было почти нечитаемо */
    --num: #ffb37d;

    --doc-bg: #191e28;
    --doc-text: #edf1f8;
    --doc-soft: #9fa9bd;
    --doc-line: #2f3747;
    --doc-code-bg: #131820;
    --doc-kw: #cbaaff;
    --doc-str: #a9e58c;
    --doc-com: #98a3ba;
    --doc-num: #ffb37d;

    --diff-chg: #33291a;
    --diff-del: #3b1f28;
    --diff-ins: #1b2a45;
    --diff-mark: #7a5d1c;
    --diff-gap: #151a22;
  }
}
:root[data-theme="dark"] {
  --bg: #101319;
  --panel: #181c25;
  --panel-2: #1f2532;
  --line: #2f3747;
  --text: #eaeef6;
  --muted: #b3bdd0;
  --dim: #8d97ab;
  --accent: #93b4ff;
  --ok: #86e39a;
  --bad: #ff93a6;
  --warn: #f2c47c;
  --kw: #cbaaff;
  --str: #a9e58c;
  --com: #96a1b8;
  --num: #ffb37d;

  --doc-bg: #191e28;
  --doc-text: #edf1f8;
  --doc-soft: #9fa9bd;
  --doc-line: #2f3747;
  --doc-code-bg: #131820;
  --doc-kw: #cbaaff;
  --doc-str: #a9e58c;
  --doc-com: #98a3ba;
  --doc-num: #ffb37d;

  --diff-chg: #33291a;
  --diff-del: #3b1f28;
  --diff-ins: #1b2a45;
  --diff-mark: #7a5d1c;
  --diff-gap: #151a22;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.app { display: grid; grid-template-columns: 288px 1fr; height: 100vh; }

/* ---------- сайдбар ---------- */
.sidebar {
  background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; padding: 18px 0 40px;
}
.brand { padding: 0 18px 16px; }
.brand h1 { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.brand p { margin: 4px 0 0; color: var(--dim); font-size: 12.5px; }
.brand .row { display: flex; gap: 6px; margin-top: 10px; }
.blk { margin-top: 18px; }
.blk > h2 {
  margin: 0; padding: 0 18px 6px; font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim);
}
.tpl {
  display: flex; gap: 10px; align-items: baseline; width: 100%;
  padding: 8px 18px; background: none; border: 0; color: var(--text);
  font: inherit; text-align: left; cursor: pointer; border-left: 2px solid transparent;
}
.tpl:hover { background: var(--panel-2); }
.tpl.on { background: var(--panel-2); border-left-color: var(--accent); }
.tpl .n { color: var(--dim); font: 12px var(--mono); min-width: 16px; }
.tpl .t { flex: 1; }
.tpl .t small { display: block; color: var(--dim); font: 11.5px var(--mono); }
.tpl .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.tpl .dot.ok { background: var(--ok); }
.tpl .dot.bad { background: var(--bad); }

/* ---------- основная область ---------- */
main { display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 16px; padding: 14px 24px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.topbar h2 { margin: 0; font-size: 16px; }
.topbar .sub { color: var(--dim); font: 12px var(--mono); }
.tabs { margin-left: auto; display: flex; gap: 4px; }
.tab {
  padding: 6px 14px; border-radius: 6px; border: 1px solid transparent;
  background: none; color: var(--muted); font: inherit; cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.on { background: var(--panel-2); border-color: var(--line); color: var(--text); }
.view { flex: 1; overflow: auto; }
.hidden { display: none !important; }

/* ---------- теория: markdown-документ на белом листе ---------- */
.sheet {
  background: var(--doc-bg); color: var(--doc-text);
  max-width: 860px; margin: 28px auto 64px; padding: 44px 56px 72px;
  border: 1px solid var(--doc-line); border-radius: 10px;
  font: 16px/1.72 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.sheet.compact {
  margin: 0; padding: 18px 20px 6px; border-radius: 8px; font-size: 15px; line-height: 1.65;
}
.sheet.compact h3, .sheet.compact h4 { margin: 14px 0 8px; font-size: 14.5px; }
.sheet.compact h3:first-child, .sheet.compact h4:first-child { margin-top: 0; }
.sheet.compact pre.code { font-size: 12.5px; }
.sheet .tools { display: flex; justify-content: flex-end; margin-bottom: 6px; }
.sheet .tools button {
  border: 1px solid var(--doc-line); background: var(--doc-bg); color: var(--doc-soft);
  font: 12px var(--mono); padding: 4px 10px; border-radius: 6px; cursor: pointer;
}
.sheet .tools button:hover { color: var(--accent); border-color: var(--accent); }

.sheet h1 {
  margin: 0 0 6px; font-size: 30px; line-height: 1.25; letter-spacing: -.01em;
  color: var(--doc-text);
}
.sheet .subtitle { margin: 0 0 30px; color: var(--doc-soft); font: 13px var(--mono); }
.sheet h2 {
  margin: 38px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--doc-line);
  font-size: 21px; line-height: 1.3;
}
.sheet h3 { margin: 26px 0 10px; font-size: 16.5px; letter-spacing: .01em; }
.sheet h4 { margin: 20px 0 8px; font-size: 15px; color: var(--doc-soft); }
.sheet p { margin: 0 0 14px; }
.sheet em { color: var(--doc-soft); font-style: normal; font: 13px var(--mono); }
.sheet ol, .sheet ul { margin: 0 0 16px; padding-left: 26px; }
.sheet li { margin: 0 0 8px; }
.sheet li::marker { color: var(--doc-soft); }
.sheet hr { border: 0; border-top: 1px solid var(--doc-line); margin: 40px 0 30px; }
.sheet code {
  font: 13.5px var(--mono); background: var(--doc-code-bg);
  border: 1px solid var(--doc-line); border-radius: 4px; padding: 1px 5px;
}
.sheet pre.code {
  margin: 0 0 18px; padding: 16px 18px; background: var(--doc-code-bg);
  border: 1px solid var(--doc-line); border-radius: 8px;
  font: 13.5px/1.62 var(--mono); white-space: pre; overflow-x: auto; color: var(--doc-text);
}
.sheet pre.code code { background: none; border: 0; padding: 0; font-size: inherit; }
.sheet pre.mdsrc {
  margin: 0; padding: 20px; background: var(--doc-code-bg); border: 1px solid var(--doc-line);
  border-radius: 8px; font: 13px/1.6 var(--mono); white-space: pre-wrap; color: var(--doc-text);
}
/* подсветка внутри листа — своя для каждой темы */
.sheet .kw { color: var(--doc-kw); } .sheet .str { color: var(--doc-str); }
.sheet .com { color: var(--doc-com); font-style: italic; } .sheet .num { color: var(--doc-num); }

/* ---------- дрилл ---------- */
.funcbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.chip {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel-2); color: var(--muted); font: 12.5px var(--mono); cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip.on { border-color: var(--accent); color: var(--text); }
.chip .last { font-size: 10px; color: var(--dim); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.chip .dot.ok { background: var(--ok); } .chip .dot.bad { background: var(--bad); }
.hint { margin-left: auto; color: var(--dim); font-size: 12px; }

.drill { display: grid; grid-template-columns: minmax(280px, 380px) minmax(420px, 1fr); height: 100%; }
.task { border-right: 1px solid var(--line); overflow: auto; padding: 20px 22px 60px; }
.task h3 { margin: 0 0 12px; font: 12px var(--mono); color: var(--accent);
  letter-spacing: .08em; text-transform: uppercase; }
.spoiler { margin-top: 22px; }
.spoiler > button {
  width: 100%; padding: 10px; border: 1px dashed var(--line); border-radius: 8px;
  background: none; color: var(--muted); font: 12px var(--mono); cursor: pointer;
}
.spoiler > button:hover { color: var(--warn); border-color: var(--warn); }

.work { display: flex; flex-direction: column; overflow: hidden; }
.toolbar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.timer {
  font: 20px/1 var(--mono); font-variant-numeric: tabular-nums; padding: 4px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);
}
.timer.over { color: var(--bad); border-color: var(--bad); }
.timer.run { border-color: var(--accent); }
button.btn {
  padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font: inherit; cursor: pointer;
}
button.btn:hover { border-color: var(--accent); }
button.btn.small { padding: 5px 10px; font-size: 12px; color: var(--muted); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0e14; font-weight: 600; }
button.btn.primary:hover { filter: brightness(1.08); }
.kbd { color: var(--dim); font: 11px var(--mono); }

.editorwrap { flex: 1; display: flex; overflow: hidden; background: var(--bg); }
.gutter {
  padding: 12px 8px 12px 14px; text-align: right; color: var(--dim);
  font: 13.5px/1.6 var(--mono); background: var(--panel); border-right: 1px solid var(--line);
  overflow: hidden; user-select: none; min-width: 46px;
}
/* подсвеченный слой ровно под кареткой: метрики обязаны совпадать до пикселя */
.codearea { position: relative; flex: 1; overflow: hidden; background: var(--bg); }
.codearea > pre.hl,
.codearea > textarea#editor {
  position: absolute; inset: 0; margin: 0; border: 0;
  padding: 12px 16px; font: 13.5px/1.6 var(--mono); tab-size: 4;
  white-space: pre; overflow-wrap: normal; letter-spacing: normal;
}
pre.hl { pointer-events: none; overflow: hidden; color: var(--text); }
textarea#editor {
  color: transparent; background: transparent; caret-color: var(--accent);
  outline: none; resize: none; overflow: auto;
}
textarea#editor::selection { background: rgba(122,162,247,.3); }
.langbtn { font: 12px var(--mono) !important; }
.out {
  border-top: 1px solid var(--line); background: var(--panel);
  max-height: 48%; overflow: auto; padding: 12px 16px 20px;
}
.out .head { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); }
.out .head .st { padding: 2px 8px; border-radius: 5px; font-weight: 600; }
.out .head .st.ok { background: rgba(123,216,143,.15); color: var(--ok); }
.out .head .st.bad { background: rgba(247,118,142,.15); color: var(--bad); }
.out pre { margin: 10px 0 0; font: 13px/1.55 var(--mono); white-space: pre-wrap; }
.out pre.err { color: var(--bad); }
.out details { margin-top: 10px; }
.out summary { color: var(--dim); font: 11px var(--mono); cursor: pointer; }
.out .head .cmp2 { margin-left: auto; }
.out .head .count { font-weight: 700; color: var(--text); }
.out .lbl {
  margin: 10px 0 4px; font: 11px var(--mono); color: var(--dim);
  letter-spacing: .08em; text-transform: uppercase;
}
.out .note { margin-top: 6px; font: 12px var(--mono); color: var(--dim); }

/* кейсы, как на LeetCode */
.cases { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 10px; }
.case {
  padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--muted); font: 12px var(--mono); cursor: pointer;
}
.case.ok { color: var(--ok); }
.case.bad { color: var(--bad); }
.case.skip { color: var(--dim); border-style: dashed; }
.case.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.casebox {
  padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
}
.casebox .lbl:first-of-type { margin-top: 0; }
.casebox pre.val {
  margin: 0; padding: 6px 10px; border-radius: 6px; background: var(--panel-2);
  font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text);
}
.casebox pre.val.bad { color: var(--bad); }
.casebox pre.val.good { color: var(--ok); }
.casebox .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.casebox .tip {
  margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0; background: var(--panel-2); font-size: 13.5px; color: var(--text);
}
.casebox .tip.trap { border-left-color: var(--warn); }
.casebox .tip b {
  margin-right: 8px; font: 700 11px var(--mono); letter-spacing: .06em;
  text-transform: uppercase; color: var(--warn);
}
.crash {
  margin: 10px 0 0; padding: 8px 10px; border-radius: 6px;
  background: var(--diff-del); color: var(--text); font: 12.5px/1.5 var(--mono);
}
button.btn.on { border-color: var(--accent); color: var(--accent); }

/* ---------- сравнение с эталоном ---------- */
.diffview { flex: 1; overflow: auto; background: var(--bg); }
.diffhead {
  position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center;
  gap: 8px 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  font: 12px var(--mono);
}
.diffhead .score { font-weight: 700; color: var(--text); }
.diffhead .score.clean { color: var(--ok); }
.diffhead .bar { width: 90px; height: 6px; border-radius: 3px; background: var(--panel-2);
  border: 1px solid var(--line); overflow: hidden; }
.diffhead .bar i { display: block; height: 100%; background: var(--ok); }
.diffhead .lg { padding: 1px 7px; border-radius: 4px; color: var(--text); }
.diffhead .lg.chg { background: var(--diff-chg); }
.diffhead .lg.del { background: var(--diff-del); }
.diffhead .lg.ins { background: var(--diff-ins); }
.diffhead .opts { margin-left: auto; display: flex; gap: 14px; }
.diffhead label { display: flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; }
.dnote { padding: 8px 16px; font: 12px var(--mono); color: var(--warn); border-bottom: 1px solid var(--line); }

table.diff { width: 100%; border-collapse: collapse; table-layout: fixed; font: 13px/1.6 var(--mono); }
table.diff col.cn { width: 42px; }
table.diff th {
  position: sticky; top: 45px; z-index: 1; padding: 6px 10px; text-align: left;
  font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  background: var(--panel); border-bottom: 1px solid var(--line);
}
table.diff th + th { border-left: 1px solid var(--line); }
table.diff td { padding: 1px 10px; vertical-align: top; color: var(--text); }
table.diff td.code { white-space: pre-wrap; overflow-wrap: anywhere; }
table.diff td.n { padding: 1px 8px; text-align: right; color: var(--dim); user-select: none; }
table.diff td.n + td.code + td.n { border-left: 1px solid var(--line); }
table.diff tr.chg td { background: var(--diff-chg); }
table.diff tr.del td:nth-child(n+3) { background: var(--diff-del); }
table.diff tr.ins td:nth-child(-n+2) { background: var(--diff-ins); }
table.diff td.gap {
  background: repeating-linear-gradient(135deg, var(--diff-gap) 0 6px, transparent 6px 12px) !important;
}
table.diff mark { background: var(--diff-mark); color: inherit; border-radius: 3px; padding: 0 1px; }
table.diff .dcom { color: var(--com); font-style: italic; }
table.diff .dind {
  margin-left: 10px; padding: 0 5px; border-radius: 3px; font-size: 11px;
  background: var(--diff-mark); color: var(--text);
}
table.diff .dempty { padding: 24px 16px; color: var(--dim); }

.empty { padding: 60px 24px; color: var(--dim); }
@media (max-width: 1180px) {
  .drill { grid-template-columns: 1fr; height: auto; }
  .task { border-right: 0; border-bottom: 1px solid var(--line); max-height: 38vh; }
  .work { min-height: 62vh; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: static; max-height: 30vh; border-right: 0;
    border-bottom: 1px solid var(--line);
  }
}
</style>
<script>
  /* тема применяется до отрисовки, чтобы не было вспышки */
  try {
    const t = localStorage.getItem("algodrill:v2:theme") || "light";
    if (t !== "auto") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Шаблоны</h1>
      <p>дрилл по 5 минут, одна функция за сессию</p>
      <div class="row">
        <button class="btn small" id="theme">тема: авто</button>
      </div>
    </div>
    <div id="nav"></div>
  </aside>

  <main>
    <div class="topbar">
      <h2 id="title">Выбери шаблон</h2>
      <span class="sub" id="subtitle"></span>
      <nav class="tabs">
        <button class="tab on" data-tab="theory">Теория</button>
        <button class="tab" data-tab="drill">Дрилл</button>
      </nav>
    </div>

    <section class="view" id="view-theory">
      <div class="empty">Слева выбери шаблон — здесь будет эталон с разбором.</div>
    </section>

    <section class="view hidden" id="view-drill">
      <div class="empty">Слева выбери шаблон.</div>
    </section>
  </main>
</div>

<script>
const LS = "algodrill:v2";
const state = { blocks: [], tpl: null, func: null, tab: "theory", lang: "python" };
const timer = { sec: 0, limit: 300, running: false, id: null, touched: false };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* ---------- источник данных: локальный сервер или статика на Pages ---------- */
const RUN_TIMEOUT = 15000;
const BOOT_TIMEOUT = 120000;                 // первый запуск тянет питон в браузер

const api = {
  offline: false,                            // true — сервера нет, читаем запечённый json
  cache: {},

  async blocks() {
    try {
      const r = await fetch("api/templates");
      if (!r.ok) throw new Error("нет сервера");
      return (await r.json()).blocks;
    } catch (e) {
      api.offline = true;
      const r = await fetch("data/templates.json");
      return (await r.json()).blocks;
    }
  },

  async template(id) {
    if (api.cache[id]) return api.cache[id];
    const url = api.offline ? `data/${id.replace("/", "__")}.json` : "api/template/" + id;
    const t = await (await fetch(url)).json();
    api.cache[id] = t;
    return t;
  },

  async run(tpl, target, code) {
    if (!api.offline) {
      const r = await fetch("api/run", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ block: tpl.block, name: tpl.name, target, code }),
      });
      return await r.json();
    }
    const parts = (tpl.run || {})[target];
    if (!parts) {
      return { ok: false, stdout: "", stderr: "для этой функции нет собранного запуска", source: code };
    }
    const res = await runInBrowser(parts.prefix + code.replace(/\s+$/, "") + "\n" + parts.suffix);
    res.user_start = parts.prefix.split("\n").length;       // для перевода номеров строк
    return res;
  },
};

/* python в браузере: воркер, чтобы бесконечный цикл можно было убить */
let pyWorker = null;
let pyBooted = false;

function runInBrowser(source) {
  return new Promise(resolve => {
    if (!pyWorker) pyWorker = new Worker("pyworker.js");
    const w = pyWorker;
    const limit = pyBooted ? RUN_TIMEOUT : BOOT_TIMEOUT;

    const timer = setTimeout(() => {
      const booted = pyBooted;                 // сбрасываем ниже, флаг нужен сейчас
      w.terminate();
      pyWorker = null; pyBooted = false;
      resolve({
        ok: false, stdout: "", source,
        stderr: booted
          ? `Таймаут: код не уложился в ${RUN_TIMEOUT / 1000} с.\n` +
            "Скорее всего бесконечный цикл или забытый сдвиг указателя."
          : "Не дождался загрузки python в браузере. Проверь сеть и запусти ещё раз.",
      });
    }, limit);

    w.onmessage = ({ data }) => {
      clearTimeout(timer);
      pyBooted = true;
      resolve({ ...data, source });
    };
    w.onerror = e => {
      clearTimeout(timer);
      pyWorker = null;
      resolve({ ok: false, stdout: "", source, stderr: "python в браузере не запустился: " + e.message });
    };

    w.postMessage({ source });
  });
}

/* ---------- языки: подсветка и правила редактирования ---------- */
const LANGS = {
  python: {
    unit: 4,
    comment: "#",
    pairs: { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'" },
    rx: /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|import|from|break|continue|pass|lambda|yield|try|except|finally|raise|with|as|assert|global|nonlocal|async|await|del)\b|\b(\d+(?:\.\d+)?)\b/g,
    indentAfter: l => /:\s*(#.*)?$/.test(l),
    dedentAfter: l => /^\s*(return|pass|break|continue|raise)\b/.test(l),
  },
  typescript: {
    unit: 2,
    comment: "//",
    pairs: { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'", "`": "`" },
    rx: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(const|let|var|function|return|if|else|for|while|do|switch|case|default|break|continue|new|delete|typeof|instanceof|in|of|this|null|undefined|true|false|class|extends|implements|interface|type|enum|namespace|declare|import|export|from|as|async|await|yield|try|catch|finally|throw|readonly|public|private|protected|static|abstract|keyof|infer|satisfies|void|never|unknown|any|string|number|boolean)\b|\b(\d+(?:\.\d+)?)\b/g,
    indentAfter: l => /[{([]\s*(\/\/.*)?$/.test(l),
    dedentAfter: () => false,
  },
};

function hi(code, lang) {
  const rx = (LANGS[lang] || LANGS.python).rx;
  let out = "", last = 0, m;
  rx.lastIndex = 0;
  while ((m = rx.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "com" : m[2] ? "str" : m[3] ? "kw" : "num";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

/* ---------- разбор докстрок: заголовок / абзац / код ---------- */
function isHeading(t) {
  if (t.length < 4 || t.length > 70 || /[.;,:]$/.test(t)) return false;
  const up = (t.match(/[A-ZА-ЯЁ]/g) || []).length;
  const lo = (t.match(/[a-zа-яё]/g) || []).length;
  if (!up) return false;
  if (up / (up + lo) >= 0.6) return true;            // «ЗАЧЕМ ЗДЕСЬ ВООБЩЕ memo»
  const first = t.split(/\s+/)[0];                   // «ПРО @lru_cache»
  return t.length <= 45 && first.length >= 3 && first === first.toUpperCase() &&
         /[A-ZА-ЯЁ]{3}/.test(first);
}
const ITEM = /^(\d+[.)]|[A-ZА-ЯЁ][.)]|[-*•])\s+/;
const LABEL = /^[А-ЯЁA-Z][А-ЯЁA-Z0-9 ]{0,20}[—-]\s/;
const IDENT = /(\b[A-Za-z_][A-Za-z0-9_]*\(\)|\b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\b|\b[A-Z]{2,}\d+\b)/g;

function cyrRatio(t) {
  const bare = t.split("#")[0];                      // русский комментарий в коде не считаем
  const letters = (bare.match(/[A-Za-zА-Яа-яЁё]/g) || []).length;
  const cyr = (bare.match(/[А-Яа-яЁё]/g) || []).length;
  return letters ? cyr / letters : -1;               // -1 = букв нет вовсе
}

function lineKind(raw) {
  if (!raw.trim()) return "blank";
  const t = raw.trim();

  if (!/^\s/.test(raw)) {                            // без отступа — возможный заголовок
    const core = t.replace(/\s*\(.*\)\s*$/, "");    // "ПОРЯДОК ДРИЛЛА (5 минут)"
    return isHeading(core) ? "head" : "text";
  }

  const ratio = cyrRatio(t);
  if (t.startsWith("#")) return "pre";               // комментарий внутри кода
  if (/\S {2,}\S/.test(t)) return "pre";            // выравнивание в столбик
  if (ratio <= 0 &&
      /^(from|import|def|class|return|if|elif|else|for|while|with|try|except|finally|lambda|assert|yield)\b/.test(t))
    return "pre";
  if (ratio < 0) return "pre";                       // ascii-схемы
  if (ITEM.test(t)) return "text";                   // нумерованный пункт
  return ratio >= 0.4 ? "text" : "pre";
}

function stitch(out) {
  // одинокая прозаичная строка между двумя блоками кода — часть таблицы
  for (let i = 1; i < out.length - 1; i++) {
    if (out[i].kind === "text" && out[i].lines.length === 1 &&
        out[i - 1].kind === "pre" && out[i + 1].kind === "pre") {
      out[i].kind = "pre";
      out[i].glue = true;
    }
  }
  // одинокая кодовая строка внутри абзаца — продолжение предложения
  for (let i = 1; i < out.length; i++) {
    const b = out[i], t = b.lines[0] ? b.lines[0].trim() : "";
    if (b.kind === "pre" && b.lines.length === 1 && out[i - 1].kind === "text" &&
        cyrRatio(t) > 0 && !/\S {2,}\S/.test(t) && !/[=:]$/.test(t) && !t.startsWith("#")) {
      b.kind = "text";
      b.glue = true;
      // строка разрезала абзац надвое — вернуть и хвост
      if (out[i + 1] && out[i + 1].kind === "text") out[i + 1].glue = true;
    }
  }
  // склеиваем только то, что переклассифицировали: абзацы, разделённые
  // пустой строкой, обязаны остаться разными абзацами
  const merged = [];
  for (const b of out) {
    const last = merged[merged.length - 1];
    if (last && last.kind === b.kind && b.kind !== "head" && (b.glue || last.glue)) {
      last.lines.push(...b.lines);
      last.glue = b.kind === "pre" && (last.glue || b.glue);
    } else {
      merged.push(b);
    }
  }
  return merged;
}

function parseDoc(text) {
  const lines = (text || "").split("\n")
    .map(l => l.replace(/^#\s?/, "").replace(/\s+$/, ""))
    .filter(l => !/^\s*[=-]{4,}\s*$/.test(l));

  const out = [];
  let cur = null;
  for (const l of lines) {
    const k = lineKind(l);
    if (k === "blank") {
      if (cur && cur.kind === "pre") cur.lines.push("");   // пустая строка в коде
      else cur = null;                                      // конец абзаца
      continue;
    }
    if (k === "head") { out.push({ kind: "head", lines: [l.trim()] }); cur = null; continue; }
    if (!cur || cur.kind !== k) { cur = { kind: k, lines: [] }; out.push(cur); }
    cur.lines.push(l);
  }
  for (const b of out) while (b.lines.length && !b.lines[b.lines.length - 1].trim()) b.lines.pop();
  return stitch(out.filter(b => b.lines.length));
}

function dedent(lines) {
  const pads = lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length);
  const cut = pads.length ? Math.min(...pads) : 0;
  return lines.map(l => l.slice(cut));
}

function paragraphs(lines) {
  const out = [];
  for (const l of lines) {
    const t = l.trim();
    if (!out.length || ITEM.test(t) || LABEL.test(t)) out.push([t]);
    else out[out.length - 1].push(t);
  }
  return out.map(p => p.join(" "));
}

function fnHead(f) {
  const lines = (f.doc || "").split("\n")
    .map(l => l.replace(/^#\s?/, "").replace(/\s+$/, ""))
    .filter(l => !/^\s*[=-]{4,}\s*$/.test(l));
  while (lines.length && !lines[0].trim()) lines.shift();

  let ref = "", variant = "";
  if (lines.length && lines[0].trim().startsWith(f.name)) {
    const parts = lines.shift().trim().split(/\s+—\s+/);
    ref = parts.slice(1).join(" — ");
  }
  while (lines.length && !lines[0].trim()) lines.shift();
  if (lines.length && /^(ВАРИАНТ|ФОРМА)[\s:]/.test(lines[0].trim())) variant = lines.shift().trim();

  return { ref, variant, rest: lines.join("\n") };
}

function renderDoc(text) {
  return parseDoc(text).map(b => {
    if (b.kind === "head") return `<h4 class="dh">${esc(b.lines[0])}</h4>`;
    if (b.kind === "pre") return `<pre class="code">${hi(dedent(b.lines).join("\n"))}</pre>`;
    return paragraphs(b.lines).map(t =>
      `<p class="dp${ITEM.test(t) ? " item" : ""}">` +
      esc(t).replace(IDENT, '<span class="id">$1</span>') + `</p>`).join("");
  }).join("");
}

/* ---------- докстрока -> markdown ---------- */
function inlineMd(t) {
  return t.replace(IDENT, "`$1`");
}

function mdText(lines) {
  const out = [];
  let list = null;

  for (const t of paragraphs(lines)) {
    const num = t.match(/^(\d+)[.)]\s+([\s\S]*)$/);
    const alp = t.match(/^([A-ZА-ЯЁ][.)])\s+([\s\S]*)$/);
    const bul = t.match(/^[-*•]\s+([\s\S]*)$/);

    if (num) {
      if (!list || list.type !== "ol") { list = { type: "ol", items: [] }; out.push(list); }
      list.items.push(`${num[1]}. ${inlineMd(num[2])}`);
    } else if (alp || bul) {
      if (!list || list.type !== "ul") { list = { type: "ul", items: [] }; out.push(list); }
      list.items.push(alp ? `- **${alp[1]}** ${inlineMd(alp[2])}` : `- ${inlineMd(bul[1])}`);
    } else {
      list = null;
      out.push(inlineMd(t));
    }
  }
  return out.map(x => typeof x === "string" ? x : x.items.join("\n")).join("\n\n");
}

function mdDoc(text, level) {
  return parseDoc(text).map(b => {
    if (b.kind === "head") return "#".repeat(level) + " " + b.lines[0];
    if (b.kind === "pre") return "```python\n" + dedent(b.lines).join("\n") + "\n```";
    return mdText(b.lines);
  }).filter(Boolean).join("\n\n");
}

function toMarkdown(t) {
  const parts = [`# Шаблон ${t.number} — ${t.title}`, "", `\`${t.block}/${t.name}\``, ""];
  parts.push(mdDoc(t.theory.split("\n").slice(1).join("\n"), 2));

  for (const f of t.functions) {
    const h = fnHead(f);
    parts.push("", "---", "", `## \`${f.name}\`${h.ref ? " — " + h.ref : ""}`, "");
    if (h.variant) parts.push(`*${h.variant}*`, "");
    parts.push(mdDoc(h.rest, 3));
    parts.push("", "```python", f.code, "```");
  }
  return parts.join("\n") + "\n";
}

/* ---------- markdown -> html ---------- */
function inlineHtml(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function mdToHtml(md) {
  const lines = md.split("\n");
  const out = [];
  let i = 0;

  const isBlock = l => /^(```|#{1,6}\s|---+\s*$|\s*(\d+[.)]|[-*])\s)/.test(l);

  while (i < lines.length) {
    const l = lines[i];

    if (!l.trim()) { i++; continue; }

    if (/^```/.test(l)) {                                   // блок кода
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out.push(`<pre class="code">${hi(code.join("\n"))}</pre>`);
      continue;
    }

    const h = l.match(/^(#{1,6})\s+(.*)$/);                 // заголовок
    if (h) { out.push(`<h${h[1].length}>${inlineHtml(h[2])}</h${h[1].length}>`); i++; continue; }

    if (/^---+\s*$/.test(l)) { out.push("<hr>"); i++; continue; }

    const li = l.match(/^\s*(\d+[.)]|[-*])\s+(.*)$/);       // список
    if (li) {
      const ordered = /\d/.test(li[1]);
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^\s*(\d+[.)]|[-*])\s+(.*)$/);
        if (m && (/\d/.test(m[1]) === ordered)) { items.push(m[2]); i++; }
        else if (!lines[i].trim() && lines[i + 1] &&
                 (lines[i + 1].match(/^\s*(\d+[.)]|[-*])\s+/) || {})[0]) i++;   // пустая строка внутри списка
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map(x => `<li>${inlineHtml(x)}</li>`).join("")}</${tag}>`);
      continue;
    }

    const para = [];                                        // абзац
    while (i < lines.length && lines[i].trim() && !isBlock(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inlineHtml(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

/* ---------- история попыток ---------- */
const histKey = (id, fn) => `${LS}:hist:${id}:${fn}`;
const draftKey = (id, fn) => `${LS}:draft:${id}:${fn}`;
function history(id, fn) {
  try { return JSON.parse(localStorage.getItem(histKey(id, fn))) || []; }
  catch (e) { return []; }
}
function pushAttempt(id, fn, sec, ok) {
  const h = history(id, fn);
  h.push({ t: Date.now(), sec, ok });
  try { localStorage.setItem(histKey(id, fn), JSON.stringify(h.slice(-30))); } catch (e) {}
}
const lastAttempt = (id, fn) => history(id, fn).slice(-1)[0] || null;
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

/* ---------- сайдбар ---------- */
function tplStatus(t) {
  const results = t.functions.map(f => lastAttempt(t.id, f)).filter(Boolean);

}

function nextUp(t) {
  let best = null;
  for (const f of t.functions) {
    const a = lastAttempt(t.id, f.name);
    const when = a ? a.t : 0;
    if (!best || when < best.when) best = { name: f.name, when };
  }
  return best ? `следующая по ротации: ${best.name}` : "";
}

  const ed = $("#editor");

const lineEnd = (v, i) => { const j = v.indexOf("\n", i); return j < 0 ? v.length : j; };

function syncScroll() {

function syncGutter() {

  if (!ed) return;
  const n = ed.value.split("\n").length;
  $("#gutter").innerHTML = Array.from({ length: n }, (_, i) => i + 1).join("<br>");
}

/* правка через execCommand — так остаётся живой нативный Ctrl+Z */
function edit(ed, text, from, to) {
  ed.focus();
  if (from !== undefined) ed.setSelectionRange(from, to === undefined ? from : to);
  let ok = false;
  try {
    ok = text === "" ? document.execCommand("delete")
                     : document.execCommand("insertText", false, text);
  } catch (e) { ok = false; }
  if (!ok) {                                            // запасной путь, undo теряется
    const s = ed.selectionStart, t = ed.selectionEnd;
    ed.value = ed.value.slice(0, s) + text + ed.value.slice(t);
    ed.selectionStart = ed.selectionEnd = s + text.length;
    ed.dispatchEvent(new Event("input"));
  }
}

function shiftLines(ed, dir) {
  const L = lang(), v = ed.value;
  const from = lineStart(v, ed.selectionStart), to = lineEnd(v, ed.selectionEnd);
  const unit = " ".repeat(L.unit);
  const out = v.slice(from, to).split("\n").map(l =>
    dir > 0 ? (l.trim() ? unit + l : l)
            : l.replace(new RegExp("^ {1," + L.unit + "}"), "")).join("\n");
  edit(ed, out, from, to);
  ed.setSelectionRange(from, from + out.length);
}

function toggleComment(ed) {
  const L = lang(), v = ed.value;
  const from = lineStart(v, ed.selectionStart), to = lineEnd(v, ed.selectionEnd);
  const lines = v.slice(from, to).split("\n");
  const token = L.comment;
  const escaped = token.replace(/[/*]/g, c => "\\" + c);
  const commented = lines.every(l => !l.trim() || l.trimStart().startsWith(token));

  const out = lines.map(l => {
    if (!l.trim()) return l;
    if (commented) return l.replace(new RegExp("^(\\s*)" + escaped + " ?"), "$1");
    const ind = indentOf(l);
    return ind + token + " " + l.slice(ind.length);
  }).join("\n");

  edit(ed, out, from, to);
  ed.setSelectionRange(from, from + out.length);
}

function editorKeys(e) {
  const ed = e.target, L = lang(), unit = " ".repeat(L.unit);
  const v = ed.value, s = ed.selectionStart, t = ed.selectionEnd;
  const mod = e.metaKey || e.ctrlKey;

  if (mod && e.key === "Enter") { e.preventDefault(); return run(); }
  if (mod && (e.key === "/" || e.code === "Slash")) { e.preventDefault(); return toggleComment(ed); }
  if (mod || e.altKey) return;                          // остальные сочетания не трогаем

  if (e.key === "Tab") {
    e.preventDefault();
    if (e.shiftKey || v.slice(s, t).includes("\n")) return shiftLines(ed, e.shiftKey ? -1 : 1);
    const col = s - lineStart(v, s);
    return edit(ed, " ".repeat(L.unit - (col % L.unit)));
  }

  if (e.key === "Enter") {
    e.preventDefault();
    const line = v.slice(lineStart(v, s), s);
    const base = indentOf(line);
    const prev = v[s - 1], next = v[t];

    if (prev && next && "([{".includes(prev) && L.pairs[prev] === next) {
      edit(ed, "\n" + base + unit + "\n" + base);       // раскрыть скобки
      const caret = s + 1 + base.length + unit.length;
      return ed.setSelectionRange(caret, caret);
    }

    let pad = base;
    if (L.indentAfter(line)) pad += unit;               // после ":" или "{"
    else if (L.dedentAfter(line)) pad = pad.slice(0, Math.max(0, pad.length - L.unit));
    return edit(ed, "\n" + pad);
  }

  if (e.key === "Backspace" && s === t && s > 0) {
    const before = v.slice(lineStart(v, s), s);
    if (/^ +$/.test(before) && before.length % L.unit === 0) {
      e.preventDefault();
      return edit(ed, "", s - L.unit, s);               // снять уровень целиком
    }
    if (L.pairs[v[s - 1]] === v[s]) {
      e.preventDefault();
      return edit(ed, "", s - 1, s + 1);                // пустая пара — удалить обе
    }
    return;
  }

  const close = L.pairs[e.key];
  if (close) {
    const sel = v.slice(s, t);
    if (sel) {                                          // обернуть выделение
      e.preventDefault();
      edit(ed, e.key + sel + close, s, t);
      return ed.setSelectionRange(s + 1, s + 1 + sel.length);
    }
    const quote = !"([{".includes(e.key);
    if (quote && v[s] === e.key) {                      // проскочить свою же кавычку
      e.preventDefault();
      return ed.setSelectionRange(s + 1, s + 1);
    }
    if (!/[\w"'`]/.test(v[s] || "")) {                  // не лепим пару перед словом
      e.preventDefault();
      edit(ed, e.key + close);
      return ed.setSelectionRange(s + 1, s + 1);
    }
    return;
  }

  if (s === t && ")]}".includes(e.key) && v[s] === e.key) {
    e.preventDefault();                                 // проскочить закрывающую
    ed.setSelectionRange(s + 1, s + 1);
  }
}

function setLang(name) {
  state.lang = LANGS[name] ? name : "python";
  const b = $("#lang");
  if (b) b.textContent = state.lang;
  paintEditor();
  saveSession();
}

/* ---------- построчное сравнение с эталоном ---------- */
const DIFF_KEY = LS + ":diffopts";
const diffOpts = (() => {
  try { return { comments: true, spaces: true, ...JSON.parse(localStorage.getItem(DIFF_KEY)) }; }
  catch (e) { return { comments: true, spaces: true }; }
})();

const TOKENS = /\s+|\w+|[^\w\s]/g;

/* комментарий режем только вне строковых литералов */
function splitComment(line, token) {
  let q = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === "\\") i++;
      else if (c === q) q = null;
      continue;
    }
    if (c === '"' || c === "'" || c === "`") { q = c; continue; }
    if (line.startsWith(token, i)) return [line.slice(0, i).replace(/\s+$/, ""), line.slice(i)];
  }
  return [line.replace(/\s+$/, ""), ""];
}

/* значимые строки: пустые и чисто-комментарные не сравниваем */
function diffLines(src, token) {
  const rows = (src || "").replace(/\s+$/, "").split("\n").map((raw, i) => {
    const [code, comment] = diffOpts.comments ? splitComment(raw, token) : [raw.replace(/\s+$/, ""), ""];
    let body = code.trim();
    if (diffOpts.spaces) body = body.replace(/\s+/g, " ").replace(/\s*([^\w\s])\s*/g, "$1");
    return { n: i + 1, code, comment, indent: indentOf(code).length, body };
  }).filter(r => r.body);

  // отступ сравниваем относительный: сдвиг всей функции целиком — не ошибка
  const base = rows.length ? Math.min(...rows.map(r => r.indent)) : 0;
  for (const r of rows) {
    r.level = r.indent - base;
    r.text = r.code.slice(base);
    r.key = r.level + "|" + r.body;
  }
  return rows;
}

function lcsTable(a, b, same) {
  const dp = Array.from({ length: a.length + 1 }, () => new Uint16Array(b.length + 1));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      dp[i][j] = same(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  return dp;
}

const words = s => (s.match(TOKENS) || []).filter(t => t.trim());

function similarity(x, y) {
  const a = words(x.body), b = words(y.body);
  if (!a.length || !b.length) return 0;
  return 2 * lcsTable(a, b, (p, q) => p === q)[0][0] / (a.length + b.length);
}

/* внутри блока несовпадений пары ищем по похожести, а не по порядку */
function alignHunk(mine, ref) {
  const MIN = 0.35;
  const n = mine.length, m = ref.length;
  const sim = mine.map(x => ref.map(y => similarity(x, y)));
  const dp = Array.from({ length: n + 1 }, () => new Float64Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1],
                          sim[i][j] >= MIN ? sim[i][j] + dp[i + 1][j + 1] : -1);

  const rows = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (sim[i][j] >= MIN && Math.abs(dp[i][j] - (sim[i][j] + dp[i + 1][j + 1])) < 1e-9)
      rows.push({ t: "chg", a: mine[i++], b: ref[j++] });
    else if (dp[i][j + 1] >= dp[i + 1][j]) rows.push({ t: "del", b: ref[j++] });
    else rows.push({ t: "ins", a: mine[i++] });
  }
  while (j < m) rows.push({ t: "del", b: ref[j++] });
  while (i < n) rows.push({ t: "ins", a: mine[i++] });
  return rows;
}

function buildRows(mine, ref) {
  const dp = lcsTable(mine, ref, (x, y) => x.key === y.key);
  const rows = [];
  let i = 0, j = 0, hunkA = [], hunkB = [];
  const flush = () => {
    if (hunkA.length || hunkB.length) rows.push(...alignHunk(hunkA, hunkB));
    hunkA = []; hunkB = [];
  };
  while (i < mine.length && j < ref.length) {
    if (mine[i].key === ref[j].key) { flush(); rows.push({ t: "eq", a: mine[i++], b: ref[j++] }); }
    else if (dp[i + 1][j] >= dp[i][j + 1]) hunkA.push(mine[i++]);
    else hunkB.push(ref[j++]);
  }
  hunkA.push(...mine.slice(i));
  hunkB.push(...ref.slice(j));
  flush();
  return rows;
}

/* подсветка отличающихся токенов в паре похожих строк */
function tokenMarks(a, b) {
  const ta = a.match(TOKENS) || [], tb = b.match(TOKENS) || [];
  const sa = ta.map((t, i) => ({ t, i })).filter(x => x.t.trim());
  const sb = tb.map((t, i) => ({ t, i })).filter(x => x.t.trim());
  const dp = lcsTable(sa, sb, (p, q) => p.t === q.t);

  const keepA = new Set(), keepB = new Set();
  let i = 0, j = 0;
  while (i < sa.length && j < sb.length) {
    if (sa[i].t === sb[j].t) { keepA.add(sa[i++].i); keepB.add(sb[j++].i); }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else j++;
  }
  const paint = (toks, keep) => toks.map((t, k) =>
    !t.trim() || keep.has(k) ? esc(t) : `<mark>${esc(t)}</mark>`).join("");
  return [paint(ta, keepA), paint(tb, keepB)];
}

function diffCell(line, html) {
  if (!line) return `<td class="n"></td><td class="code gap"></td>`;
  const com = line.comment ? `<span class="dcom"> ${esc(line.comment.trim())}</span>` : "";
  return `<td class="n">${line.n}</td><td class="code">${html === undefined ? esc(line.text) : html}${com}</td>`;
}

function renderDiff() {
  const box = $("#diffview");
  if (!box || !state.tpl) return;
  const f = state.tpl.functions.find(x => x.name === state.func);

  const mine = diffLines($("#editor").value, lang().comment);
  const ref = diffLines(f.code, LANGS.python.comment);       // эталон всегда на python
  const rows = buildRows(mine, ref);

  const cnt = { eq: 0, chg: 0, del: 0, ins: 0 };
  rows.forEach(r => cnt[r.t]++);
  const total = ref.length;
  const pct = total ? Math.round(100 * cnt.eq / total) : 0;
  const clean = cnt.eq === total && !cnt.ins;

  const body = rows.map(r => {
    if (r.t === "chg") {
      const [ha, hb] = tokenMarks(r.a.text, r.b.text);
      const ind = r.a.level !== r.b.level ? `<span class="dind">отступ</span>` : "";
      return `<tr class="chg">${diffCell(r.a, ha)}${diffCell(r.b, hb + ind)}</tr>`;
    }
    return `<tr class="${r.t}">${diffCell(r.a)}${diffCell(r.b)}</tr>`;
  }).join("");

  const note = state.lang !== "python"
    ? `<div class="dnote">эталон написан на python — в режиме ${esc(state.lang)} сравнение показывает скорее разницу языков</div>` : "";

  box.innerHTML = `
    <div class="diffhead">
      <span class="score ${clean ? "clean" : ""}">${clean ? "один в один с эталоном" : `совпало с эталоном: ${cnt.eq} из ${total}`}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      ${cnt.chg ? `<span class="lg chg">отличается: ${cnt.chg}</span>` : ""}
      ${cnt.del ? `<span class="lg del">нет у тебя: ${cnt.del}</span>` : ""}
      ${cnt.ins ? `<span class="lg ins">лишнее: ${cnt.ins}</span>` : ""}
      <span class="opts">
        <label><input type="checkbox" id="dcom" ${diffOpts.comments ? "checked" : ""}> без комментариев</label>
        <label><input type="checkbox" id="dsp" ${diffOpts.spaces ? "checked" : ""}> без пробелов</label>
      </span>
    </div>
    ${note}
    <table class="diff">
      <colgroup><col class="cn"><col><col class="cn"><col></colgroup>
      <thead><tr><th colspan="2">твой код</th><th colspan="2">эталон</th></tr></thead>
      <tbody>${body || `<tr><td colspan="4" class="dempty">сравнивать нечего — в редакторе пусто</td></tr>`}</tbody>
    </table>`;

  const toggle = (id, key) => {
    $(id).onchange = e => {
      diffOpts[key] = e.target.checked;
      try { localStorage.setItem(DIFF_KEY, JSON.stringify(diffOpts)); } catch (err) {}
      renderDiff();
    };
  };
  toggle("#dcom", "comments");
  toggle("#dsp", "spaces");
}

function setCompare(on) {
  state.cmp = !!on;
  const view = $("#diffview");
  if (!view) return;
  view.classList.toggle("hidden", !state.cmp);
  $(".editorwrap").classList.toggle("hidden", state.cmp);
  $("#cmp").textContent = state.cmp ? "назад к коду" : "построчно с эталоном";
  $("#cmp").classList.toggle("on", state.cmp);
  if (state.cmp) renderDiff();
  else $("#editor").focus();
  saveSession();
}

/* ---------- таймер ---------- */
function paintTimer() {
  const el = $("#timer"); if (!el) return;
  const left = timer.limit - timer.sec;
  el.textContent = left >= 0 ? mmss(left) : "+" + mmss(-left);
  el.classList.toggle("over", left < 0);
  el.classList.toggle("run", timer.running);
  const b = $("#tstart"); if (b) b.textContent = timer.running ? "пауза" : "старт";
}
function startTimer() {
  if (timer.running) return;
  timer.running = true;
  timer.id = setInterval(() => { timer.sec++; paintTimer(); saveSession(); }, 1000);
  paintTimer();
}
function stopTimer() { timer.running = false; clearInterval(timer.id); paintTimer(); saveSession(); }
function toggleTimer() { timer.running ? stopTimer() : startTimer(); }
function resetTimer() { stopTimer(); timer.sec = 0; paintTimer(); }

/* ---------- запуск ---------- */
/* ---------- результат прогона: кейсы, как на LeetCode ---------- */
const REPORT_MARK = "__DRILL_REPORT__";
let lastRun = null;                        // { res, rep, cases, sel } — для переключения кейсов

/* отчёт — отдельная строка в stdout; вынимаем её, остальное — вывод твоих print-ов */
function takeReport(res) {
  const lines = (res.stdout || "").split("\n");
  const i = lines.findIndex(l => l.startsWith(REPORT_MARK));
  if (i < 0) return null;
  let rep = null;
  try { rep = JSON.parse(lines[i].slice(REPORT_MARK.length)); } catch (e) { return null; }
  lines.splice(i, 1);
  res.stdout = lines.join("\n").replace(/\s+$/, "");
  return rep;
}

function verdict(res, rep) {
  if (rep) {
    const crashed = rep.tests.some(t => t.crash);
    const raised = rep.tests.some(t => t.cases.some(c => c.fail && c.fail.error));
    if (rep.total && rep.passed === rep.total && !crashed) return { ok: true, title: "Принято" };
    return { ok: false, title: crashed || raised ? "Ошибка выполнения" : "Неверный ответ" };
  }
  const err = res.stderr || "";
  if (/Таймаут/.test(err)) return { ok: false, title: "Превышено время" };
  if (/SyntaxError|IndentationError|TabError/.test(err)) return { ok: false, title: "Синтаксическая ошибка" };
  return { ok: !!res.ok, title: res.ok ? "Выполнено" : "Ошибка выполнения" };
}

/* номер строки из трейсбека — в номер строки твоего кода */
function userLine(res) {
  const m = [...(res.stderr || "").matchAll(/line (\d+)/g)].pop();
  if (!m || !res.user_start) return null;
  const n = +m[1] - res.user_start + 1;
  const total = ($("#editor") ? $("#editor").value : "").replace(/\s+$/, "").split("\n").length;
  return n >= 1 && n <= total ? n : null;
}

const caseState = c => !c.runs ? "skip" : c.fail ? "bad" : "ok";
const where = w => w ? ` — строка ${w} твоего кода` : "";

function caseDetail(c) {
  const st = caseState(c);
  const trap = c.hint && c.hint.includes("(!)");
  const hint = c.hint ? c.hint.replace(/\(!\)\s*/g, "") : "";
  const tip = hint || trap
    ? `<div class="tip ${trap ? "trap" : ""}">${trap ? "<b>ловушка</b>" : ""}${esc(hint)}</div>` : "";

  const check = c.op === null;
  let body = `<div class="lbl">${check ? "Проверка" : "Ввод"}</div><pre class="val">${hi(c.input)}</pre>`;

  if (st === "skip") {
    body += `<div class="note">до этого кейса прогон не дошёл — тест упал раньше, см. выше</div>`;
  } else if (c.fail && c.fail.error) {
    body += `<div class="lbl">Ошибка</div><pre class="val bad">${esc(c.fail.error)}${esc(where(c.fail.where))}</pre>`;
  } else if (check) {
    body += `<div class="lbl">Результат</div><pre class="val ${c.fail ? "bad" : ""}">${
      c.fail ? "ложь — проверка не прошла" : "истина"}</pre>`;
  } else {
    const opText = c.op === "==" || c.op === "is" ? "" : c.op + " ";
    const want = c.fail ? c.fail.want : c.expect;
    body += `<div class="pair">
      <div><div class="lbl">Твой ответ</div>
        <pre class="val ${c.fail ? "bad" : "good"}">${c.fail ? esc(c.fail.got) : "совпадает"}</pre></div>
      <div><div class="lbl">Ожидалось</div><pre class="val">${esc(opText + want)}</pre></div>
    </div>`;
  }

  const stdout = (c.fail && c.fail.stdout) || c.stdout;
  if (stdout) body += `<div class="lbl">Stdout</div><pre class="val">${esc(stdout)}</pre>`;
  if (c.runs > 1) body += `<div class="note">проверок в цикле: ${c.runs}, прошло ${c.passed}</div>`;

  return tip + body;
}

function selectCase(i) {
  if (!lastRun) return;
  lastRun.sel = i;
  $("#view-drill").querySelectorAll(".case").forEach(el =>
    el.classList.toggle("on", +el.dataset.i === i));
  $("#casebox").innerHTML = caseDetail(lastRun.cases[i]);
}

function renderResult(res, rep, sec) {
  const v = verdict(res, rep);
  const cases = rep ? rep.tests.flatMap(t => t.cases) : [];
  const bad = cases.findIndex(c => caseState(c) !== "ok");
  lastRun = { res, rep, cases, sel: bad >= 0 ? bad : 0 };

  const overdue = sec > timer.limit ? " · дольше пяти минут" : "";
  const chips = cases.map((c, i) => {
    const st = caseState(c);
    const mark = st === "ok" ? "✓" : st === "bad" ? "✗" : "·";
    return `<button class="case ${st}" data-i="${i}" title="${esc(c.input)}">${mark} Кейс ${i + 1}</button>`;
  }).join("");

  const crashes = rep ? rep.tests.filter(t => t.crash).map(t => `
    <div class="crash">тест <b>${esc(t.name)}</b> упал вне кейсов:
      ${esc(t.crash.error)}${esc(where(t.crash.where))}.
      Кейсы после этого места не запускались.</div>`).join("") : "";

  const line = rep ? null : userLine(res);
  const raw = [
    res.stdout ? `<div class="lbl">Вывод</div><pre>${esc(res.stdout)}</pre>` : "",
    !rep && res.stderr ? `<pre class="err">${esc(res.stderr)}</pre>` : "",
    line ? `<div class="note">это строка ${line} твоего кода</div>` : "",
  ].join("");

  return `
    <div class="head">
      <span class="st ${v.ok ? "ok" : "bad"}">${v.title}</span>
      ${rep ? `<span class="count">${rep.passed} / ${rep.total} кейсов</span>` : ""}
      <span style="color:var(--dim)">${esc(state.func)} · ${mmss(sec)}${overdue}</span>
      ${state.cmp ? "" : '<button class="btn small cmp2" id="cmp2">построчно с эталоном →</button>'}
    </div>
    ${crashes}
    ${cases.length ? `<div class="cases">${chips}</div><div class="casebox" id="casebox"></div>` : ""}
    ${raw}
    ${res.source ? `<details><summary>что именно запускалось</summary>
       <pre class="code" style="margin-top:8px">${hi(res.source)}</pre></details>` : ""}`;
}

async function run() {
  const t = state.tpl, fn = state.func;
  const out = $("#out");
  out.innerHTML = `<div class="head"><span style="color:var(--dim)">${
    api.offline && !pyBooted ? "загружаю python в браузере, это разово ~10 МБ…" : "гоняю тесты…"
  }</span></div>`;
  saveDraft();

  let res;
  try {
    res = await api.run(t, fn, $("#editor").value);
  } catch (e) {
    out.innerHTML = `<div class="head"><span class="st bad">запустить не вышло</span>
      <span style="color:var(--dim)">${esc(e.message || String(e))}</span></div>`;
    return;
  }

  const rep = takeReport(res);
  const ok = verdict(res, rep).ok;
  const sec = timer.sec;
  if (ok) stopTimer();
  pushAttempt(t.id, fn, sec, ok);

  out.innerHTML = renderResult(res, rep, sec);
  out.querySelectorAll(".case").forEach(el => { el.onclick = () => selectCase(+el.dataset.i); });
  if (lastRun.cases.length) selectCase(lastRun.sel);

  const cmp2 = $("#cmp2");
  if (cmp2) cmp2.onclick = () => setCompare(true);
  if (state.cmp) renderDiff();
  renderChips();
  renderNav();
}

function renderChips() {
  const t = state.tpl;
  $("#view-drill").querySelectorAll(".chip").forEach(el => {
    const a = lastAttempt(t.id, el.dataset.fn);
    const dot = el.querySelector(".dot");
    dot.className = "dot" + (a ? (a.ok ? " ok" : " bad") : "");
    let last = el.querySelector(".last");
    if (a) {
      if (!last) { last = document.createElement("span"); last.className = "last"; el.appendChild(last); }
      last.textContent = mmss(a.sec);
    }
  });
  const hint = $(".hint"); if (hint) hint.textContent = nextUp(t);
}

/* ---------- состояние сессии: что открыто и где остановились ---------- */
const SESSION = LS + ":session";
const FN_KEY = id => `${LS}:fn:${id}`;
const RESUME_GAP = 30 * 60 * 1000;      // дольше получаса — считаем, что бросил
let theoryScroll = 0;                   // скрытый элемент отдаёт 0, помним сами

function loadSession() {
  try { return JSON.parse(localStorage.getItem(SESSION)) || {}; } catch (e) { return {}; }
}

function saveSession() {
  if (!state.tpl) return;
  const src = $("#sheetsrc");
  const data = {
    id: state.tpl.id,
    tab: state.tab,
    func: state.func,
    lang: state.lang,
    cmp: !!state.cmp,
    mdsrc: !!(src && !src.classList.contains("hidden")),
    theoryScroll,
    timer: { sec: timer.sec, running: timer.running, at: Date.now() },
  };
  try {
    localStorage.setItem(SESSION, JSON.stringify(data));
    localStorage.setItem(FN_KEY(state.tpl.id), state.func || "");
  } catch (e) {}
}

function restoreTimer(sess) {
  if (!sess.timer || sess.id !== state.tpl.id || sess.func !== state.func) return;
  const gap = Date.now() - (sess.timer.at || 0);
  const alive = sess.timer.running && gap < RESUME_GAP;
  timer.sec = sess.timer.sec + (alive ? Math.floor(gap / 1000) : 0);
  paintTimer();
  if (alive) startTimer();                       // шёл до перезагрузки — идёт и дальше
}

/* ---------- тема ---------- */
const THEMES = ["auto", "light", "dark"];
const THEME_NAME = { auto: "тема: авто", light: "тема: светлая", dark: "тема: тёмная" };

function applyTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  try { localStorage.setItem(LS + ":theme", t); } catch (e) {}
  $("#theme").textContent = THEME_NAME[t];
}

function cycleTheme() {
  const now = localStorage.getItem(LS + ":theme") || "auto";
  applyTheme(THEMES[(THEMES.indexOf(now) + 1) % THEMES.length]);
}

/* ---------- навигация ---------- */
async function openTemplate(id, sess) {
  saveDraft();
  saveSession();

  state.tpl = await api.template(id);

  const names = state.tpl.functions.map(f => f.name);
  const remembered = (sess && sess.id === id && sess.func) || localStorage.getItem(FN_KEY(id));
  state.func = names.includes(remembered) ? remembered : (names[0] || null);

  resetTimer();
  theoryScroll = 0;
  state.cmp = false;
  $("#title").textContent = `${state.tpl.number}. ${state.tpl.title}`;
  $("#subtitle").textContent = `${state.tpl.block}/${state.tpl.name}`;
  location.hash = id;

  renderNav();
  renderTheory();
  renderDrill();

  if (sess && sess.id === id) {                 // вернулись туда же — вернуть и состояние
    if (sess.mdsrc) $("#mdsrc").click();
    if (sess.cmp) setCompare(true);
    restoreTimer(sess);
    theoryScroll = sess.theoryScroll || 0;
    const view = $("#view-theory");
    requestAnimationFrame(() => { view.scrollTop = theoryScroll; });
  }
  saveSession();
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#view-theory").classList.toggle("hidden", tab !== "theory");
  $("#view-drill").classList.toggle("hidden", tab !== "drill");
  if (tab === "drill") { const ed = $("#editor"); if (ed) ed.focus(); }
  if (tab === "theory") {                       // прокрутку ставим, когда вкладка видима
    const view = $("#view-theory");
    requestAnimationFrame(() => { view.scrollTop = theoryScroll; });
  }
  saveSession();
}

document.querySelectorAll(".tab[data-tab]").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#theme").onclick = cycleTheme;
applyTheme(localStorage.getItem(LS + ":theme") || "light");
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.cmp && state.tab === "drill") setCompare(false);
});
window.addEventListener("beforeunload", () => { saveDraft(); saveSession(); });

let scrollSaver = null;
$("#view-theory").addEventListener("scroll", () => {
  const view = $("#view-theory");
  if (view.classList.contains("hidden")) return;       // скрытая вкладка не считается
  theoryScroll = view.scrollTop;
  clearTimeout(scrollSaver);
  scrollSaver = setTimeout(saveSession, 250);
});
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && (!state.tpl || state.tpl.id !== id)) openTemplate(id);
});

(async function boot() {
  state.blocks = await api.blocks();
  renderNav();

  const sess = loadSession();
  if (sess.lang && LANGS[sess.lang]) state.lang = sess.lang;
  const fallback = state.blocks[0] && state.blocks[0].templates[0] &&
                   state.blocks[0].templates[0].id;
  const id = location.hash.slice(1) || sess.id || fallback;

  if (id) await openTemplate(id, sess);
  setTab(sess.id === id ? (sess.tab || "theory") : "theory");
})();
</script>
</body>
